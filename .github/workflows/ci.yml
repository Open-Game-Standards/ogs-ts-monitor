name: ci
# Builds, tests and packages the monitor on each platform's own runner.
# ogs-ts-dotnet (the decoder) and OGS-Telemetry-Standard (the conformance
# corpus the tests decode) are checked out as siblings: the workspace layout
# the project references assume.
#
# Pushes to main publish a CalVer release (vYYYY.MM.DD, UTC; a same-day
# rerun appends the run number, v2026.10.28.N), as the loader mods do:
#   win-x64    single-file .exe (zip)
#   linux-x64  single-file binary (tar.gz, keeps the executable bit)
#   osx-arm64, osx-x64  "OGS-TS Monitor.app" (zip), signed and notarized
#
# Signing is isolated: only the sign-macos job sees the Developer ID, and it
# runs in the `release` environment, which holds the secrets, is limited to
# main and needs a maintainer's approval. Approving it is what releases.
# Environment secrets: MACOS_CERTIFICATE (base64 .p12),
# MACOS_CERTIFICATE_PASSWORD, APPLE_API_KEY (base64 .p8), APPLE_API_KEY_ID,
# APPLE_API_ISSUER_ID. Pull requests build an unsigned app instead.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  ORG: Open-Game-Standards
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.calver.outputs.tag }}
      version: ${{ steps.calver.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, for the same-day check
          fetch-tags: true
      - id: calver
        run: |
          base="v$(date -u +%Y.%m.%d)"
          tag="$base"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            tag="$base.${{ github.run_number }}"
          fi
          # dotted numeric, as .NET and CFBundleVersion want (no leading zeros)
          version=$(echo "${tag#v}" | awk -F. '{ for (i = 1; i <= NF; i++) printf "%s%d", (i > 1 ? "." : ""), $i }')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "CalVer $tag ($version)"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: macos-latest, rid: osx-arm64 }
          - { os: macos-latest, rid: osx-x64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: ogs-ts-monitor
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.ORG }}/ogs-ts-dotnet
          path: ogs-ts-dotnet
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.ORG }}/OGS-Telemetry-Standard
          path: OGS-Telemetry-Standard
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build ogs-ts-monitor/OgsTsMonitor.slnx --nologo
      - name: Test (incl. the standard's conformance corpus)
        run: dotnet test ogs-ts-monitor/tests/Ogs.Telemetry.Monitor.Tests --nologo --no-build

      - name: Publish (Windows, Linux)
        if: runner.os != 'macOS'
        run: |
          dotnet publish ogs-ts-monitor/src/OgsTsMonitor -c Release -r ${{ matrix.rid }} --self-contained \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:Version="$VERSION" \
            -o out --nologo
          cp ogs-ts-monitor/README.md ogs-ts-monitor/LICENSE out/
          mkdir -p dist
          name="OgsTsMonitor-${TAG#v}-${{ matrix.rid }}"
          if [ "$RUNNER_OS" = Windows ]; then
            pwsh -NoProfile -Command "Compress-Archive -Path out/* -DestinationPath dist/$name.zip"
          else
            chmod +x out/OgsTsMonitor
            tar -czf "dist/$name.tar.gz" -C out .
          fi

      - name: Publish and bundle, unsigned (macOS)
        if: runner.os == 'macOS'
        run: |
          dotnet publish ogs-ts-monitor/src/OgsTsMonitor -c Release -r ${{ matrix.rid }} --self-contained \
            -p:DebugType=none -p:UseAppHost=true -p:Version="$VERSION" -o out --nologo
          mkdir -p dist
          bash ogs-ts-monitor/build/macos/bundle.sh out "$VERSION" "dist/OgsTsMonitor-${TAG#v}-${{ matrix.rid }}-unsigned.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error
      - name: Keep the macOS publish for signing
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: publish-${{ matrix.rid }}
          path: out/
          if-no-files-found: error

  sign-macos:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [version, build]
    strategy:
      matrix:
        rid: [osx-arm64, osx-x64]
    runs-on: macos-latest
    environment: release # holds the signing secrets; needs approval
    steps:
      - uses: actions/checkout@v7
        with:
          path: ogs-ts-monitor
      - uses: actions/download-artifact@v8
        with:
          name: publish-${{ matrix.rid }}
          path: out
      - name: Bundle, sign and notarize
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          REQUIRE_SIGNING: "1"
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          mkdir -p dist
          bash ogs-ts-monitor/build/macos/bundle.sh out "${{ needs.version.outputs.version }}" \
            "dist/OgsTsMonitor-${TAG#v}-${{ matrix.rid }}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: signed-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [version, build, sign-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: app-win-x64
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: app-linux-x64
          path: dist
      - uses: actions/download-artifact@v8
        with:
          pattern: signed-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: OGS-TS Monitor ${{ needs.version.outputs.tag }}
          files: dist/*
